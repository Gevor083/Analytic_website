version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-analytics_db}
      POSTGRES_USER: ${DB_USER:-analytics_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-analytics_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn analytics_project.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120"
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    env_file:
      - analytics_project/.env
    environment:
      - USE_REDIS=true
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    restart: always
    command: celery -A analytics_project worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    env_file:
      - analytics_project/.env
    environment:
      - USE_REDIS=true
      - DEBUG=false
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: always
    command: celery -A analytics_project beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - analytics_project/.env
    environment:
      - USE_REDIS=true
      - DEBUG=false
    depends_on:
      - redis

volumes:
  postgres_data:
  uploads_data:
