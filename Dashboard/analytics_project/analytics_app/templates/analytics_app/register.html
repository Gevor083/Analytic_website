{% extends 'analytics_app/base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-primary">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <span class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;font-size:2rem;">
                            <i class="fa fa-user-plus"></i>
                        </span>
                        <h2 class="fw-bold mt-3 mb-1">Register</h2>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <i class="fa fa-exclamation-circle me-2"></i> {{ error }}
                        </div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="reg_username" name="username" placeholder="Username" required>
                            <label for="reg_username"><i class="fa fa-user"></i> Username</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="reg_email" name="email" placeholder="Email" required>
                            <label for="reg_email"><i class="fa fa-envelope"></i> Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="reg_password" name="password" placeholder="Password" required>
                            <label for="reg_password"><i class="fa fa-lock"></i> Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fa fa-user-plus"></i> Register</button>
                        <div class="mt-3 text-center">
                            <a href="{% url 'login' %}" class="btn btn-link text-primary fw-bold"><i class="fa fa-sign-in-alt"></i> Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
