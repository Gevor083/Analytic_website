{% extends 'analytics_app/base.html' %}

{% block title %}Upload{% endblock %}

{% block content %}
<div class="container py-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-primary">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <span class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width:56px;height:56px;font-size:2rem;">
                            <i class="fa fa-file-upload"></i>
                        </span>
                        <h2 class="fw-bold mt-3 mb-1">Upload Your Files</h2>
                        <p class="text-muted">Supported formats: <strong>.csv, .json</strong></p>
                    </div>
                    {% if error %}
                        <div class="alert alert-danger d-flex align-items-center" role="alert">
                            <i class="fa fa-exclamation-circle me-2"></i> {{ error }}
                        </div>
                    {% endif %}
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input type="file" name="file" id="file" class="form-control" accept=".csv,.json,.sql" placeholder="Choose a file">
                            <label for="file"><i class="fa fa-file"></i> Choose a file</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fa fa-upload"></i> Upload</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
